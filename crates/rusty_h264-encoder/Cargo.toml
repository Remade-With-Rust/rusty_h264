[package]
name = "rusty_h264-encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_h264-encoder"
description = "Pure-Rust H.264 encoder (Baseline/Main: intra, P-frames, quarter-pel ME, CABAC, adaptive quantization, ABR rate control) — bit-exact under ffmpeg across QP 0-51. forbid(unsafe) core; portable Rust SIMD on by default. BSD-2."
keywords = ["h264", "avc", "video", "codec", "encoder"]
categories = ["multimedia::video", "multimedia::encoding"]

[dependencies]
# No default features: `global-alloc` is this crate's (and the facade's) default.
rusty_h264-common = { workspace = true, default-features = false }
# Optional hand-tuned asm acceleration (openh264 BSD-2 kernels). The unsafe FFI is
# fully quarantined inside that crate; this crate calls only its safe wrappers, so
# it stays forbid(unsafe) even with `--features asm`.
rusty_h264-accel = { path = "../rusty_h264-accel", version = "0.12.0", optional = true }

[dev-dependencies]
# The decoder is our round-trip oracle: encoder tests decode their own output and
# assert pixel-exact recon (the bringup-encoder verification spine).
#
# PATH-ONLY, deliberately — no `version` key. The decoder dev-depends back on the
# encoder (fuzz-test seed generation), so a versioned dev-dep in both directions is
# a publish deadlock: each would require the other's new version to already be on
# crates.io. Cargo strips a version-less dev-dependency when packaging, which breaks
# the cycle and lets the release go out in dependency order (accel → common →
# encoder → decoder → facade). Local `cargo test` is unaffected — the path resolves.
rusty_h264-decoder = { path = "../rusty_h264-decoder" }

[features]
# rusty_alloc AND the SIMD kernels on by default (asm default since 2026-08-27,
# audit finding X2). Scalar-arm probes (e.g. `--example dectest`) must now pass
# `--no-default-features` explicitly — the default arm is the shipping one.
default = ["global-alloc", "asm"]
global-alloc = ["rusty_h264-common/global-alloc"]
# Portable Rust SIMD kernels for the hot paths (DCT/quant/MC/deblock/…) —
# pure Rust intrinsics, no assembler (the vendored NASM was ripped 2026-08-12).
asm = ["dep:rusty_h264-accel", "rusty_h264-common/asm"]
# Dev-only stage profiler (see rusty_h264-common::prof) — zero-cost when off.
profile = ["rusty_h264-common/profile"]
# CABAC entropy-bin telemetry for the private Prometheus refinery (CASC
# campaign): records every context-coded bin (ctx_idx, state, MPS, bin) on the
# real slice-encode path. Off by default; the bitstream is byte-identical with
# it on or off — the tap only observes.
prometheus-telemetry = []

[lints.rust]
unsafe_code = "forbid"
