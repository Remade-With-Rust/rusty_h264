[package]
name = "rusty_h264-encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_h264-encoder"
description = "Pure-Rust H.264 encoder (Baseline/Main: intra, P-frames, quarter-pel ME, CABAC, adaptive quantization, ABR rate control) — bit-exact under ffmpeg across QP 0-51. forbid(unsafe) core; portable Rust SIMD on by default. BSD-2."
keywords = ["h264", "avc", "video", "codec", "encoder"]
categories = ["multimedia::video", "multimedia::encoding"]

[dependencies]
# No default features: `global-alloc` is this crate's (and the facade's) default.
rusty_h264-common = { workspace = true, default-features = false }
# Optional hand-tuned asm acceleration (openh264 BSD-2 kernels). The unsafe FFI is
# fully quarantined inside that crate; this crate calls only its safe wrappers, so
# it stays forbid(unsafe) even with `--features asm`.
rusty_h264-accel = { path = "../rusty_h264-accel", version = "0.16.0", optional = true }

[dev-dependencies]
# The decoder is our round-trip oracle: encoder tests decode their own output and
# assert pixel-exact recon (the bringup-encoder verification spine).
#
# PATH-ONLY, deliberately — no `version` key. The decoder dev-depends back on the
# encoder (fuzz-test seed generation), so a versioned dev-dep in both directions is
# a publish deadlock: each would require the other's new version to already be on
# crates.io. Cargo strips a version-less dev-dependency when packaging, which breaks
# the cycle and lets the release go out in dependency order (accel → common →
# encoder → decoder → facade). Local `cargo test` is unaffected — the path resolves.
rusty_h264-decoder = { path = "../rusty_h264-decoder" }

[features]
# rusty_alloc AND the SIMD kernels on by default (asm default since 2026-08-27,
# audit finding X2). Scalar-arm probes (e.g. `--example dectest`) must now pass
# `--no-default-features` explicitly — the default arm is the shipping one.
default = ["std", "global-alloc", "asm"]
# `std`: parallel GOP encoding, the environment knobs, the debug sinks and the
# per-thread scratch. Without it the crate is `no_std` + `alloc` and needs `libm`.
std = ["rusty_h264-common/std"]
# Pure-Rust libm: required without std; with std it makes float decisions
# bit-identical between a host and a chip.
libm = ["rusty_h264-common/libm"]
global-alloc = ["rusty_h264-common/global-alloc"]
# Portable Rust SIMD kernels for the hot paths (DCT/quant/MC/deblock/…) —
# pure Rust intrinsics, no assembler (the vendored NASM was ripped 2026-08-12).
asm = ["dep:rusty_h264-accel", "rusty_h264-common/asm"]
# Dev-only stage profiler (see rusty_h264-common::prof) — zero-cost when off.
profile = ["std", "rusty_h264-common/profile"]
# CABAC entropy-bin telemetry for the private Prometheus refinery (CASC
# campaign): records every context-coded bin (ctx_idx, state, MPS, bin) on the
# real slice-encode path. Off by default; the bitstream is byte-identical with
# it on or off — the tap only observes.
prometheus-telemetry = ["std"]

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
# The rest of the allow-list, each with the reason it is here. A policy is only
# worth having if every warning left in it means something, and these fire on
# shapes that are deliberate in this codebase rather than defects in it:
#   drop_non_drop        -- `drop(guard)` is used to END A BORROW at a precise
#                           point in the row/worker handoff. The value not
#                           implementing Drop is the point: the scope is what
#                           matters, and naming it beats a bare closing brace.
#   doc_lazy_continuation-- this codebase's doc comments are prose with embedded
#                           measurement tables; clippy's list-indent rule
#                           reflows them into something less readable.
#   empty_line_after_*   -- a blank line between a long rationale comment and
#                           the item it explains is deliberate formatting here.
#   box_collection       -- `Box<Vec<T>>` is the POOLED job shape: the box is
#                           the pool's handle and is moved between threads, so
#                           the extra indirection is the feature.
#   declare_interior_mutable_const -- the census counters are `const` atomics by
#                           design; each use site wants its own instance.
#   field_reassign_with_default -- building a large record field-by-field after
#                           `default()` is how the packing paths stay readable.
drop_non_drop = "allow"
doc_lazy_continuation = "allow"
empty_line_after_outer_attr = "allow"
empty_line_after_doc_comments = "allow"
box_collection = "allow"
declare_interior_mutable_const = "allow"
borrow_interior_mutable_const = "allow"
field_reassign_with_default = "allow"
# SIMD kernels are nothing but sequences of intrinsic calls; one block per
# operation would be noise, not safety. The SAFETY comment covers the block.
multiple_unsafe_ops_per_block = "allow"
# API-modernisation suggestions, not correctness ones. `x % n == 0` and
# `chunks_exact(N)` are the forms this codebase reads in throughout; swapping
# them for `is_multiple_of` / `as_chunks` would churn hundreds of lines of hot
# code for no behavioural change, and `as_chunks` in particular reshapes loops
# whose byte-identity is gated.
manual_is_multiple_of = "allow"
manual_div_ceil = "allow"
missing_transmute_annotations = "allow"
# `Vec<Box<T>>` is the POOLED-JOB shape, not an accident: the box IS the pool's
# handle. Jobs are moved between the parse thread and the EDC worker, so the
# indirection is what makes the move O(1) and keeps the job's address stable
# while the worker holds it. Flattening to `Vec<T>` would copy a large record on
# every hand-off, on the decoder's hot path.
vec_box = "allow"
doc_overindented_list_items = "allow"
# TIER-SCOPED, and this is the standard's own "tier down, don't fake up" rule.
#
# H-18's criterion is "no unwrap/expect/panic on paths reachable from UNTRUSTED
# INPUT". The encoder's input is the caller's own YUV frames -- it produces
# bitstreams rather than consuming them -- so it is a `standard`-tier unit and
# the denial that binds the decoder does not bind here. Marking these `allow`
# with the reason written down is honest; leaving a `deny` that fails the build
# would push someone to delete the policy outright.
#
# The crates that DO eat attacker-controlled bytes -- decoder, common, cli and
# the facade -- keep `deny`, and that is what actually protects H-18.
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
