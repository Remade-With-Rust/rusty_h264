[package]
name = "rusty_h264"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_h264"
description = "A ground-up, pure-Rust H.264 encoder and decoder. Decoder bit-exact vs Cisco openh264 (Baseline + B-slices + most of High profile); encoder bit-exact vs ffmpeg. forbid(unsafe) codec core; optional vendored openh264 SIMD asm (on by default — `--no-default-features` for pure safe Rust). BSD-2."
keywords = ["h264", "avc", "video", "codec", "decoder"]
categories = ["multimedia::video", "multimedia::encoding"]

# docs.rs has no nasm; build the pure-Rust docs so generation never depends on the
# asm toolchain.
[package.metadata.docs.rs]
no-default-features = true

[dependencies]
# `default-features = false` so the facade owns the feature menu; `global-alloc`
# and `asm` are re-enabled in `default` below.
rusty_h264-common = { workspace = true, default-features = false }
rusty_h264-encoder = { workspace = true, default-features = false }
rusty_h264-decoder = { workspace = true, default-features = false }

[features]
# asm + rusty_alloc on by default. `--no-default-features` is pure scalar AND
# the system allocator; re-enable pieces with `--features asm` / `global-alloc`.
default = ["asm", "global-alloc"]
# Install rusty_alloc as the process-wide allocator (via rusty_h264-common).
# Downstream apps that declare their own `#[global_allocator]` must build with
# `default-features = false` (and opt back into `asm` as needed).
global-alloc = [
    "rusty_h264-common/global-alloc",
    "rusty_h264-encoder/global-alloc",
    "rusty_h264-decoder/global-alloc",
]
# openh264 asm acceleration for the encoder + decoder hot kernels (MC, deblock,
# transforms). On by default; build with `--no-default-features` for the pure
# scalar path (no nasm needed).
asm = ["rusty_h264-encoder/asm", "rusty_h264-decoder/asm"]
# In-process stage profiler + the per-rung ME counters (`diastats`). Off by
# default (zero overhead, release byte-identical); the COUNT instruments behind
# it are exact regardless of the profiler's own timing tax.
profile = ["rusty_h264-encoder/profile", "rusty_h264-common/profile"]
# CABAC entropy-bin telemetry for the private Prometheus refinery (CASC).
# Observe-only; byte-identical on or off.
prometheus-telemetry = ["rusty_h264-encoder/prometheus-telemetry"]

[lints.rust]
unsafe_code = "forbid"
