[package]
name = "rusty_h264-decoder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_h264-decoder"
description = "Pure-Rust H.264 decoder (Baseline + B-slices + most of High profile, CAVLC + CABAC) — bit-exact vs Cisco openh264, pixel-exact vs ffmpeg, fuzzed panic-free. forbid(unsafe) core; portable Rust SIMD on by default. BSD-2."
keywords = ["h264", "avc", "video", "codec", "decoder"]
categories = ["multimedia::video", "multimedia::encoding"]

[dependencies]
# No default features: `global-alloc` is this crate's (and the facade's) default;
# `std` rides on this crate's own `std` feature.
rusty_h264-common = { workspace = true, default-features = false }

[features]
# rusty_alloc AND the SIMD kernels on by default (asm default since 2026-08-27,
# audit finding X2: `cargo test/bench -p rusty_h264-decoder` used to silently
# exercise the scalar path). The facade disables these defaults and re-enables
# via its own `global-alloc`/`asm`. Scalar arm: `--no-default-features`.
default = ["std", "global-alloc", "asm"]
# `std`: frame-level multithreading (`decode_stream_threaded`, the EDC worker),
# the `RS_H264_*` knobs and the debug dumps. Without it the crate is `no_std` +
# `alloc`: the serial decoder, one thread, every knob at its default. Needs
# `libm` (through rusty_h264-common) without `std`.
std = ["rusty_h264-common/std"]
libm = ["rusty_h264-common/libm"]
global-alloc = ["rusty_h264-common/global-alloc"]
# Portable Rust SIMD kernels (x86-64 SSE2/AVX2, aarch64 NEON) — no assembler.
# Pure pass-through since 2026-08-27 (audit site 4): every kernel the decoder
# reaches is dispatched inside rusty_h264-common's wrappers — this crate held a
# direct rusty_h264-accel dependency + a cfg-emitting build.rs that NOTHING in
# the crate used (zero `rusty_h264_accel::`/`cfg(accel)` references), a phantom
# edge that invited "the decoder gates on accel" assumptions. The `unsafe`
# stays quarantined in rusty_h264-accel; this crate remains forbid(unsafe).
asm = ["rusty_h264-common/asm"]
# Enable the in-process decode stage profiler (used by the `profile_decode` test).
profile = ["std", "rusty_h264-common/profile"]

[dev-dependencies]
# Used only by the fuzz test to generate valid seed streams to mutate.
rusty_h264-encoder = { workspace = true, features = ["std"] }
# `sim_sxs` ONLY (the headful side-by-side viewer). A dev-dependency, so it is
# absent from the published crate and from every consumer's build: the shipped
# decoder gains no window system. minifb talks to the OS window API directly and
# builds no C.
minifb = "0.28"

# The examples are host tools (files, timers, windows); none is part of the
# `no_std` surface.
[[example]]
name = "sim_sxs"
required-features = ["asm", "std"]

[[example]]
name = "sim_oppy"
required-features = ["asm", "std"]

[[example]]
name = "corpus"
required-features = ["std"]

[[example]]
name = "decode_bench"
required-features = ["std"]

[[example]]
name = "decode_prof"
required-features = ["std"]

[[example]]
name = "fmt_census"
required-features = ["std"]

[[example]]
name = "oracle"
required-features = ["std"]

[lints.rust]
unsafe_code = "forbid"
