[package]
name = "rusty_h264-decoder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_h264-decoder"
description = "Pure-Rust H.264 decoder (Baseline + B-slices + most of High profile, CAVLC + CABAC) — bit-exact vs Cisco openh264, pixel-exact vs ffmpeg, fuzzed panic-free. forbid(unsafe) core; optional SIMD asm. BSD-2."
keywords = ["h264", "avc", "video", "codec", "decoder"]
categories = ["multimedia::video", "multimedia::encoding"]

[dependencies]
# No default features: `global-alloc` is this crate's (and the facade's) default.
rusty_h264-common = { workspace = true, default-features = false }
rusty_h264-accel = { path = "../rusty_h264-accel", version = "0.11.0", optional = true }

[features]
# rusty_alloc on by default for examples / `cargo test -p rusty_h264-decoder`.
# The facade disables these defaults and re-enables via its own `global-alloc`.
default = ["global-alloc"]
global-alloc = ["rusty_h264-common/global-alloc"]
# Pass-through: decode with openh264 asm acceleration. Shared MC/deblock kernels
# live in rusty_h264-common; the decoder also calls the inverse-DCT kernel
# directly. The unsafe FFI stays quarantined in rusty_h264-accel; this crate
# remains forbid(unsafe).
asm = ["dep:rusty_h264-accel", "rusty_h264-common/asm"]
# Enable the in-process decode stage profiler (used by the `profile_decode` test).
profile = ["rusty_h264-common/profile"]

[dev-dependencies]
# Used only by the fuzz test to generate valid seed streams to mutate.
rusty_h264-encoder.workspace = true
# `sim_sxs` ONLY (the headful side-by-side viewer). A dev-dependency, so it is
# absent from the published crate and from every consumer's build: the shipped
# decoder gains no window system. minifb talks to the OS window API directly and
# builds no C.
minifb = "0.28"

[[example]]
name = "sim_sxs"
required-features = ["asm"]

[lints.rust]
unsafe_code = "forbid"
