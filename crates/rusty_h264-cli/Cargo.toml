[package]
publish = false
name = "rusty_h264-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Command-line encode/decode tools for rusty_h264 (mirrors openh264's codec/console)."

[[bin]]
name = "rusty_h264"
path = "src/main.rs"

[dependencies]
# CLI default = asm. rusty_alloc comes from rusty_h264-common's default features
# (pulled transitively); keep common's defaults on when disabling facade asm.
rusty_h264 = { path = "../rusty_h264", version = "0.12.0", default-features = false, features = ["std", "global-alloc"] }
rusty_h264-common = { workspace = true, features = ["std"] }


[features]
default = ["asm"]
# Build the CLI with the portable SIMD kernels (on by default; the speed path).
# `--no-default-features` builds the scalar codec. No assembler either way.
asm = ["rusty_h264/asm"]

[lints.rust]
unsafe_code = "forbid"
