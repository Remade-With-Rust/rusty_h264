# rusty_h264 — a ground-up, pure-Rust H.264 codec (Remade With Rust / Mata Network).
#
# Workspace layout mirrors Cisco's openh264 codec/ tree:
#   codec/common   -> crates/rusty_h264-common    shared bitstream + types + transforms
#   codec/encoder  -> crates/rusty_h264-encoder   the encode pipeline (built first)
#   codec/decoder  -> crates/rusty_h264-decoder   the decode pipeline (oracle/round-trip)
#   codec/api      -> crates/rusty_h264           public, safe facade API
#   codec/console  -> crates/rusty_h264-cli       encode/decode command-line tools
[workspace]
resolver = "2"
members = [
    "crates/rusty_h264-common",
    "crates/rusty_h264-encoder",
    "crates/rusty_h264-decoder",
    "crates/rusty_h264",
    "crates/rusty_h264-cli",
    "crates/rusty_h264-accel",
    "crates/rusty_h264-memprobe",
]
# The fuzz crate needs nightly and links libFuzzer; neither belongs in a plain
# `cargo build` at the root. Built with `cargo +nightly fuzz run <target>`.
exclude = ["fuzz"]

[workspace.package]
version = "0.16.0"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/remade-with-rust/rusty_h264"
# Remade With Rust is Mata Network's open-source home; the org page links every
# sibling project (remade_ffmpeg_rs, FFAI, …).
homepage = "https://www.mata.network/"
authors = ["Mata Network"]
# CORRECTED 2026-09-07 (was 1.80, which was not true). The workspace uses
# `Option::is_none_or`, stable since 1.82, so a consumer on 1.80 or 1.81 got a
# compile error rather than the clear "requires rustc 1.82" cargo reports when
# the manifest is honest. Verified against the installed 1.85 toolchain.
rust-version = "1.85"

[workspace.dependencies]
# Pure-Rust portable SIMD with a safe API (uses core::arch internally, so our
# codec crates keep `unsafe_code = "forbid"`; no C/C++ in the build).
wide = { version = "1.7", default-features = false }
# `default-features = false` HERE, at workspace level (2026-08-27): Cargo
# IGNORES a member's `default-features = false` on a `workspace = true` dep
# (the long-standing warning §11.18 of inline-execution.md flagged). With the
# codec crates now defaulting `asm` ON, leaving this unset would have made
# `--no-default-features` builds silently carry the SIMD kernels anyway — the
# scalar oracle arm would be dead while every gate claimed to test it. Members
# that want defaults opt back IN (enabling is allowed; only disabling is
# ignored).
rusty_h264-common = { path = "crates/rusty_h264-common", version = "0.16.0", default-features = false }
rusty_h264-encoder = { path = "crates/rusty_h264-encoder", version = "0.16.0", default-features = false }
rusty_h264-decoder = { path = "crates/rusty_h264-decoder", version = "0.16.0", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# HARDENING GATE H-05 -- AND THE ONE PLACE THIS AUDIT CHOSE SPEED, WITH A NUMBER.
#
# `overflow-checks = true` here was MEASURED at **1.225x slower decode** (9/9
# paired, z=3.00, 1800-frame 720p workload, CPU time, bench/pinvs.ps1). The
# other two mitigations added in the same pass cost nothing at all: Control Flow
# Guard and frame pointers together measured **1.000x** (3/15, z=-2.32). So the
# entire cost of hardening this codec was this one line, and it was 22.5%.
#
# Why shipping without it is defensible HERE specifically, and would not be in C:
# every crate that touches a bitstream is `#![forbid(unsafe_code)]`, so a wrapped
# value cannot become an out-of-bounds access. It becomes a bounds-checked panic
# -- and since the panic-elimination pass, a `DecodeError`. The exploit path that
# makes overflow-checks non-negotiable in an unsafe language does not exist here;
# what is left is a wrong-pixels bug, at 22.5% of every frame for every user.
#
# The check is NOT abandoned -- it moves to where it catches bugs rather than
# where it taxes users. `release-checked` below is what CI, the fuzz job and the
# conformance gates build, so any arithmetic that was not deliberately modular
# still trips there, on every PR.
#
# TO REVERSE (if wrong pixels ever matter more than 22.5%): set this to `true`.
# The proper fix is to spell the hot loops' modular arithmetic `wrapping_*` so
# the checks vanish from them and this can go back on cheaply; that is the
# tracked follow-up on H-05's waiver.
overflow-checks = false
# Declared, not defaulted (the gate asks binaries to choose). UNWIND, not abort:
# the EDC worker's cleanup path in `mb16.rs` uses `catch_unwind` to close the
# job channel before joining, and the no-panic fuzzer needs to catch an unwind
# to report a seed. `abort` would turn that diagnosable failure into a bare
# crash and would silently disable the recovery.
panic = "unwind"

# The arithmetic-checked profile: identical to `release` but with the overflow
# checks on. CI, the fuzzer and the conformance gates build THIS, so a
# non-deliberate overflow is still caught on every PR -- it just is not paid for
# on every frame in production.
#
#     cargo test --profile release-checked --workspace --features asm
[profile.release-checked]
inherits = "release"
overflow-checks = true

# ---------------------------------------------------------------------------
# WORKSPACE LINT POLICY (hardening gate H-15).
#
# Deliberately NOT `pedantic`: on a codec that produces hundreds of style
# warnings nobody reads, and a policy nobody reads is not a policy. These lints
# instead MECHANICALLY ENFORCE the gates this audit just closed, so they cannot
# silently regress:
#
#   * `unwrap_used`/`expect_used`/`panic` keep H-18 closed -- a decoder that
#     eats untrusted bytes must not carry an unwind primitive. Allowed in tests
#     via `clippy.toml`, where a panic IS the failure report.
#   * `undocumented_unsafe_blocks` keeps H-16 moving: every `unsafe` block in
#     `-accel` must carry a `// SAFETY:` comment.
#   * `unsafe_op_in_unsafe_fn` stops an `unsafe fn` body from being an implicit
#     unsafe block, which is what makes those SAFETY comments meaningful.
[workspace.lints.rust]
# The DEFAULT for this workspace is no unsafe at all. Only two crates opt out,
# and each does so in its own manifest with a written reason -- so "which crates
# may use unsafe" is a two-line grep rather than a property of six files.
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "warn"
# ALLOWED, with reasons -- a lint policy is only worth having if the warnings
# left in it all mean something. These fire on shapes that are INHERENT to a
# codec, not defects in it:
#   too_many_arguments  -- a macroblock reconstruction call genuinely takes the
#                          macroblock's position, mode, coefficients, neighbour
#                          availability and output planes. Bundling them into a
#                          struct to satisfy a counter would add a copy on the
#                          hottest path in the decoder.
#   needless_range_loop -- block/pixel loops index several parallel planes at
#                          the same offset; the index IS the meaning.
#   type_complexity     -- the scratch tuples handed to the residual path are
#                          fixed-size array references whose shape is the point.
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
# The rest of the allow-list, each with the reason it is here. A policy is only
# worth having if every warning left in it means something, and these fire on
# shapes that are deliberate in this codebase rather than defects in it:
#   drop_non_drop        -- `drop(guard)` is used to END A BORROW at a precise
#                           point in the row/worker handoff. The value not
#                           implementing Drop is the point: the scope is what
#                           matters, and naming it beats a bare closing brace.
#   doc_lazy_continuation-- this codebase's doc comments are prose with embedded
#                           measurement tables; clippy's list-indent rule
#                           reflows them into something less readable.
#   empty_line_after_*   -- a blank line between a long rationale comment and
#                           the item it explains is deliberate formatting here.
#   box_collection       -- `Box<Vec<T>>` is the POOLED job shape: the box is
#                           the pool's handle and is moved between threads, so
#                           the extra indirection is the feature.
#   declare_interior_mutable_const -- the census counters are `const` atomics by
#                           design; each use site wants its own instance.
#   field_reassign_with_default -- building a large record field-by-field after
#                           `default()` is how the packing paths stay readable.
drop_non_drop = "allow"
doc_lazy_continuation = "allow"
empty_line_after_outer_attr = "allow"
empty_line_after_doc_comments = "allow"
box_collection = "allow"
declare_interior_mutable_const = "allow"
borrow_interior_mutable_const = "allow"
field_reassign_with_default = "allow"
# SIMD kernels are nothing but sequences of intrinsic calls; one block per
# operation would be noise, not safety. The SAFETY comment covers the block.
multiple_unsafe_ops_per_block = "allow"
# API-modernisation suggestions, not correctness ones. `x % n == 0` and
# `chunks_exact(N)` are the forms this codebase reads in throughout; swapping
# them for `is_multiple_of` / `as_chunks` would churn hundreds of lines of hot
# code for no behavioural change, and `as_chunks` in particular reshapes loops
# whose byte-identity is gated.
manual_is_multiple_of = "allow"
manual_div_ceil = "allow"
missing_transmute_annotations = "allow"
# `Vec<Box<T>>` is the POOLED-JOB shape, not an accident: the box IS the pool's
# handle. Jobs are moved between the parse thread and the EDC worker, so the
# indirection is what makes the move O(1) and keeps the job's address stable
# while the worker holds it. Flattening to `Vec<T>` would copy a large record on
# every hand-off, on the decoder's hot path.
vec_box = "allow"
doc_overindented_list_items = "allow"
