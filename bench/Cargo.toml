# Deterministic A/B benchmark harness: rusty_h264 (pure Rust) vs Cisco openh264.
#
# This crate depends on NOTHING that compiles C/C++ — it is pure Rust and only
# depends on the rusty_h264 codec crates. The Cisco openh264 side is driven as an
# EXTERNAL, separately-installed process (ffmpeg built with libopenh264), spawned
# at runtime. Nothing in `cargo build` here touches a C/C++ compiler.
#
# It is also intentionally outside the main workspace (empty [workspace] table)
# so it shares no build graph with the codec crates.
[package]
name = "rusty_h264-bench"
version = "0.0.0"
edition = "2021"
license = "BSD-2-Clause"
publish = false

[workspace]

[dependencies]
# CASC A0 needs the normative CABAC init/transition tables directly.
# `global-alloc` is opt-in on the library (an allocator belongs in a deliverable, not
# a published lib). The harness enables it so every measurement runs on the same
# allocator the shipped CLI does — otherwise the numbers describe a build nobody ships.
rusty_h264-common = { path = "../crates/rusty_h264-common", features = ["global-alloc"] }
rusty_h264 = { path = "../crates/rusty_h264" }

[features]
# Pass-through for the per-rung ME counters (`mecost` example). Counts are exact
# regardless of the profiler's own timing tax, which is why a COUNT instrument
# can live behind the profile feature without qualification.
profile = ["rusty_h264/profile"]
# CABAC entropy-bin tap for the CASC harvest driver (cabac_harvest example).
prometheus-telemetry = ["rusty_h264/prometheus-telemetry"]

[[bin]]
name = "bench"
path = "src/main.rs"

[[example]]
name = "cabac_harvest"
required-features = ["prometheus-telemetry"]
