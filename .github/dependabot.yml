# Dependency freshness with a human in the loop (hardening gate H-14).
#
# Grouped and monthly on purpose: this workspace has a 16-crate production
# dependency surface, and a PR per patch bump would train reviewers to rubber-
# stamp. Security updates are NOT grouped or delayed.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      all-non-security:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "needs-review"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["ci", "needs-review"]
